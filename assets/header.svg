<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Bhavith Parna — Biomedical Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0E14"/>
      <stop offset="60%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#11161F"/>
    </linearGradient>
    <clipPath id="traceClip"><rect x="596" y="46" width="568" height="150"/></clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="1"/>
      <stop offset="12%" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="88%" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="258" rx="14" fill="url(#bg)" stroke="#1F2630"/>

  <!-- faint ridge line: the pass -->
  <path d="M596,196 L660,168 L700,180 L760,138 L812,158 L880,116 L940,140 L1010,104 L1070,128 L1140,96 L1164,110 L1164,196 Z"
        fill="#131A24" opacity="0.9"/>

  <!-- EEG / evoked-potential trace, scrolling -->
  <g clip-path="url(#traceClip)">
    <g transform="translate(596,130)">
      <g>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-280 0" dur="6s" repeatCount="indefinite"/>
        <g stroke="#2EA043" stroke-width="6" fill="none" opacity="0.18" stroke-linecap="round" stroke-linejoin="round">
          <path d="M0,0 L20,0 L28,-6 L36,4 L48,0 L70,0 L78,-3 L86,3 L100,0 L120,0 L126,-40 L132,26 L138,-8 L146,0 L170,0 L180,-5 L190,6 L200,0 L230,0 L238,-4 L246,4 L256,0 L280,0"/>
          <path transform="translate(280,0)" d="M0,0 L20,0 L28,-6 L36,4 L48,0 L70,0 L78,-3 L86,3 L100,0 L120,0 L126,-40 L132,26 L138,-8 L146,0 L170,0 L180,-5 L190,6 L200,0 L230,0 L238,-4 L246,4 L256,0 L280,0"/>
          <path transform="translate(560,0)" d="M0,0 L20,0 L28,-6 L36,4 L48,0 L70,0 L78,-3 L86,3 L100,0 L120,0 L126,-40 L132,26 L138,-8 L146,0 L170,0 L180,-5 L190,6 L200,0 L230,0 L238,-4 L246,4 L256,0 L280,0"/>
          <path transform="translate(840,0)" d="M0,0 L20,0 L28,-6 L36,4 L48,0 L70,0 L78,-3 L86,3 L100,0 L120,0 L126,-40 L132,26 L138,-8 L146,0 L170,0 L180,-5 L190,6 L200,0 L230,0 L238,-4 L246,4 L256,0 L280,0"/>
        </g>
        <g stroke="#3FB950" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M0,0 L20,0 L28,-6 L36,4 L48,0 L70,0 L78,-3 L86,3 L100,0 L120,0 L126,-40 L132,26 L138,-8 L146,0 L170,0 L180,-5 L190,6 L200,0 L230,0 L238,-4 L246,4 L256,0 L280,0"/>
          <path transform="translate(280,0)" d="M0,0 L20,0 L28,-6 L36,4 L48,0 L70,0 L78,-3 L86,3 L100,0 L120,0 L126,-40 L132,26 L138,-8 L146,0 L170,0 L180,-5 L190,6 L200,0 L230,0 L238,-4 L246,4 L256,0 L280,0"/>
          <path transform="translate(560,0)" d="M0,0 L20,0 L28,-6 L36,4 L48,0 L70,0 L78,-3 L86,3 L100,0 L120,0 L126,-40 L132,26 L138,-8 L146,0 L170,0 L180,-5 L190,6 L200,0 L230,0 L238,-4 L246,4 L256,0 L280,0"/>
          <path transform="translate(840,0)" d="M0,0 L20,0 L28,-6 L36,4 L48,0 L70,0 L78,-3 L86,3 L100,0 L120,0 L126,-40 L132,26 L138,-8 L146,0 L170,0 L180,-5 L190,6 L200,0 L230,0 L238,-4 L246,4 L256,0 L280,0"/>
        </g>
      </g>
    </g>
  </g>
  <rect x="596" y="46" width="568" height="150" fill="url(#fade)"/>

  <!-- identity -->
  <text x="56" y="96" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="15" letter-spacing="4" fill="#3FB950">BVRIT '27 · Hyderabad, IN</text>
  <text x="56" y="152" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="42" font-weight="700" letter-spacing="2" fill="#E6EDF3">BHAVITH PARNA</text>
  <text x="56" y="184" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="15" letter-spacing="1" fill="#8B949E">biomedical engineer · neural interfaces · mixed reality</text>

  <!-- blinking cursor -->
  <rect x="420" y="132" width="13" height="22" fill="#3FB950">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- the road: moving dashes -->
  <line x1="36" y1="222" x2="1164" y2="222" stroke="#1F2630" stroke-width="2"/>
  <line x1="36" y1="222" x2="1164" y2="222" stroke="#3FB950" stroke-width="2" stroke-opacity="0.55" stroke-dasharray="26 34">
    <animate attributeName="stroke-dashoffset" from="0" to="-60" dur="0.9s" repeatCount="indefinite"/>
  </line>

  <!-- subtle plate -->
  <rect x="1094" y="208" width="70" height="28" rx="5" fill="#0D1117" stroke="#2A3240"/>
  <text x="1129" y="227" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="15" font-weight="700" letter-spacing="2" fill="#6E7681">86</text>
</svg>
