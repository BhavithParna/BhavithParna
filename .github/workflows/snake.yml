name: generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: generate snake.svg
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          # Optional: set a GH_PAT secret (classic token, `repo` scope) so the
          # contribution calendar includes private-repo commits. Falls back to
          # the action token (public contributions only) when the secret is unset.
          github_token: ${{ secrets.GH_PAT || github.token }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#3FB950
            dist/snake-dark.svg?palette=github-dark&color_snake=#3FB950

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
