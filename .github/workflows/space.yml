name: render space

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: render space.svg
        # Optional GH_PAT secret (classic token, `repo` scope) lets the galaxy count
        # private contributions; the action token only sees public ones.
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          pip install --quiet fonttools pillow numpy
          python tools/gen_space.py dist/space.svg

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
